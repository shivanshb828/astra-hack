<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MissionPCB · Findings</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#20271f;font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}main{padding:18px}h1{font-size:24px;letter-spacing:-.7px;margin:0}h2{font-size:16px;margin:8px 0}p{margin:8px 0;overflow-wrap:anywhere}small{color:#647060}button,select,textarea{font:inherit}button,select{border:1px solid #ced5c9;background:white;border-radius:9px;padding:9px 12px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #658c22;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.primary{background:#dff398;border-color:#bfd877}#notice{color:#845b00;background:#fff4d7;padding:10px;border-radius:8px;margin:12px 0}#notice:empty{display:none}#result{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.card{background:white;border:1px solid #dfe3da;border-left:4px solid #ff1744;border-radius:12px;padding:14px;margin:12px 0}.card.unknown{border-left-color:#bd8b17}.badge{color:#ce123b;font-size:11px;font-weight:700;letter-spacing:.6px}.unknown .badge{color:#936800}.metric{font-size:23px;font-weight:600;margin:10px 0}.metric small{font-size:12px;font-weight:400;display:block}.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}textarea{display:block;width:100%;resize:vertical;min-height:64px;border:1px solid #ced5c9;border-radius:8px;padding:9px;margin:8px 0}summary{cursor:pointer;margin-top:12px}#filter{max-width:100%;width:100%}.note{padding:8px;background:#f4f6f0;border-radius:6px}footer{color:#647060;font-size:12px;margin:20px 0}#connection{display:block;margin-top:5px}body.offline .card{opacity:.65}
</style><main><h1>Design findings</h1><p><a href="/workflow">Design timeline, proposals & CAD downloads →</a></p><small id="connection">Connecting…</small><div class="actions"><button id="check" class="primary">Run full check</button><button id="flags">Show flagged areas</button></div><div id="notice" role="status"></div><label for="filter">Affected component</label><select id="filter"><option value="">All components</option></select><div id="result" role="status" aria-live="polite"></div><details id="response" hidden><summary>Command details</summary><pre id="responseText" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 monospace;max-height:200px;overflow:auto"></pre></details><div id="cards"></div><footer id="help"></footer></main><script>
const token=__LOCAL_TOKEN__,blender=location.pathname==='/assembly-companion',$=id=>document.getElementById(id);let state={},busy=false,connected=false,signature='',selected='';const drafts={};
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
function controls(){document.querySelectorAll('button').forEach(b=>b.disabled=busy||!connected)}
async function action(path,payload){if(busy||!connected)return;busy=true;controls();$('result').textContent='Working…';try{const r=await fetch(path,{method:'POST',headers:{'X-Widget-Token':token,'Content-Type':typeof payload==='string'?'text/plain':'application/json'},body:typeof payload==='string'?payload:JSON.stringify(payload)});const text=await r.text();if(!r.ok)throw Error(text);$('result').textContent=path==='/command'?text.split('\n').slice(0,2).join(' · '):'Saved.';$('response').hidden=!text.includes('\n');$('responseText').textContent=text;signature='';await poll();return true}catch(e){$('result').textContent=e.message;return false}finally{busy=false;controls()}}
function render(){const a=blender?state.assembly:state;const review=blender?a:state.review;const findings=(blender?[...(a?.findings||[]),...(a?.native_findings||[]).map(f=>({...f,object:'part-'+f.kicad_refs?.[0]}))]:review?.findings)||[];const visible=findings.filter(f=>!['PASS','pass'].includes(f.status));const refs=f=>blender?[f.object].filter(Boolean):(f.kicad_refs||[]);const options=[...new Set(visible.flatMap(refs))].sort();$('filter').replaceChildren(new Option('All components',''),...options.map(r=>new Option(r,r)));if(!options.includes(selected))selected='';$('filter').value=selected;$('cards').replaceChildren();for(const f of visible.filter(f=>!selected||refs(f).includes(selected))){const unknown=['SKIP','UNKNOWN','unknown'].includes(f.status),c=node('article',null,'card'+(unknown?' unknown':''));c.append(node('span',unknown?'NOT EVALUATED':'NEEDS ATTENTION','badge'),node('h2',(f.id||'').startsWith('mission.')?'Required separation · '+(f.kicad_refs||[]).join(' / '):f.title||f.id),node('p',f.message||f.reason||f.explanation));if(f.measured_mm!=null){const area=(f.id||'').startsWith('fit.overlap');const m=node('div',Number(f.measured_mm).toFixed(2)+(area?' mm²':' mm'),'metric');m.append(node('small',area?'Overlapping board area · no overlap allowed':(f.id||'').startsWith('zone.heat_overlap')?'Penetration into thermal zone · must be outside':f.required_mm!=null?f.required_mm+' mm required':'Measured separation'));c.append(m)}const buttons=node('div',null,'refs');for(const ref of refs(f)){const b=node('button',blender?'Focus in Blender': 'Select '+ref+' in PCB');b.onclick=()=>action(blender?'/assembly/action':'/command',blender?{action:'assembly_focus',object:ref}:'select '+ref);buttons.append(b)}c.append(buttons);if(!blender){const d=node('details'),summary=node('summary','Engineering notes');d.append(summary);for(const note of state.journal?.comments||[])if(note.finding_id===f.id)d.append(node('p',note.text,'note'));const input=node('textarea');input.setAttribute('aria-label','Note for '+f.id);input.placeholder='Why does this matter? What should change?';input.value=drafts[f.id]||'';input.oninput=()=>drafts[f.id]=input.value;const save=node('button','Save note');save.onclick=async()=>{if(!input.value.trim())return;if(await action('/comment',{finding_id:f.id,text:input.value.trim()})){drafts[f.id]='';signature='';await poll()}};d.append(input,save);c.append(d)}$('cards').append(c)}if(!$('cards').children.length)$('cards').append(node('p',!review?'Run a check to load findings.':selected?'No findings for this component.':'No open findings in this review.'));controls()}
async function poll(){try{const r=await fetch(blender?'/assembly/state':'/state');if(!r.ok)throw Error('Bridge returned '+r.status);state=await r.json();connected=!!state.connected;document.body.classList.toggle('offline',!connected);$('connection').textContent=(connected?'● Connected to ':'○ Disconnected from ')+(blender?'Blender':'KiCad');$('notice').textContent=!connected?'Reconnect the application. Displayed findings may be out of date.':(state.review_stale||state.assembly?.stale||state.assembly?.component_check_error)?'Placement or rules changed. Run full check before relying on these findings.':'';const next=JSON.stringify([state.review,state.assembly?.findings,state.assembly?.native_findings,state.journal?.comments]);if(signature!==next&&!document.activeElement?.matches('textarea')){signature=next;render()}controls()}catch(e){connected=false;document.body.classList.add('offline');$('connection').textContent='○ Bridge unavailable';$('notice').textContent='Unable to refresh. Displayed findings may be out of date. Retrying automatically.';controls()}}
$('filter').onchange=()=>{selected=$('filter').value;render()};$('check').onclick=()=>action(blender?'/assembly/action':'/command',blender?{action:'assembly_check'}:'full check');$('flags').textContent=blender?'Toggle red pulse':'Show flagged areas';$('flags').onclick=()=>action(blender?'/assembly/action':'/command',blender?{action:'assembly_flag_motion'}:'show flagged areas');$('help').textContent=blender?'Focus links reveal the affected geometry. Open Workspace for CAD import and assembly placement.':'Match component references to the red and amber markers in the 3D viewer. Selection targets the PCB editor; KiCad’s 3D viewer does not cross-select. Open Workspace to edit constraints and review design history.';poll();setInterval(poll,2500);
</script></html>
